<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>ADFG Region 635900</title>

    <style>
      /* The .dark-mode class is added to the body by JavaScript */
      body.dark-mode {
        background-color: #1a1a1a;
        color: #d9534f; /* A readable, classic red */
      }
      .dark-mode h1, .dark-mode h2 {
        color: #e60000; /* A brighter red for headings */
      }
      /* Override Bootstrap component styles in dark mode */
      .dark-mode .bg-light,
      .dark-mode .bg-secondary-subtle {
        background-color: #2c2c2c !important; /* Use !important to override Bootstrap's utilities */
      }
      .dark-mode .border {
        border-color: #555 !important;
      }
      .dark-mode .form-check-label {
        color: #fff; /* Make the toggle label white for contrast */
      }
    </style>
  </head>
  <body>

    <div class="container mt-4">
      
      <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" role="switch" id="darkModeToggle">
        <label class="form-check-label" for="darkModeToggle">Night Mode</label>
      </div>

      <h1 class="mb-4 text-center">ADFG Statistical Region: 635900</h1>

      <div class="row">
        
        <div class="col-md-12">
          <div class="p-4 border bg-light rounded-3">
            <h2>Dynamic Plot</h2>
            <iframe src="635900.plotly.html" height="350px" width="800px"></iframe>
          </div>
        </div>
        
      </div>
      <div class="row">

        <div class="col-md-12">
          <div class="p-4 border bg-light rounded-3">
            <h2>Static Image</h2>
            <img src="635900.image.png" height="300px"/>

          </div>
        </div>

      </div>

    </div>

    <footer class="bg-secondary-subtle text-white py-5 mt-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-6 col-md-3 text-center mb-3 mb-md-0">
                    <img src="branding/W-Logo_Purple_RGB.png" width="25%" class="img-fluid rounded" alt="UW Logo">
                </div>
                
                <div class="col-6 col-md-3 text-center mb-3 mb-md-0">
                    <img src="branding/acronym_large-768x336.png" width="50%" class="img-fluid rounded" alt="CICOES Logo">
                </div>

                <div class="col-6 col-md-3 text-center mb-3 mb-md-0">
                    <img src="branding/nprb-logo-light.webp" width="25%" class="img-fluid rounded" alt="NPRB Logo">
                </div>

                <div class="col-6 col-md-3 text-center">
                    <img src="branding/AKSCLogo297x125.png" width="50%" class="img-fluid rounded" alt="AKSC Logo">
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-12 text-center text-secondary small">
                    &copy; 2025 EcoFOCI. All rights reserved.
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const darkModeToggle = document.getElementById('darkModeToggle');
      const currentTheme = localStorage.getItem('theme');

      // On page load, check if a theme is saved in localStorage
      if (currentTheme) {
        document.body.classList.add(currentTheme);
        if (currentTheme === 'dark-mode') {
          darkModeToggle.checked = true;
        }
      }

      // Add event listener to the toggle switch
      darkModeToggle.addEventListener('change', function() {
        // Toggle the .dark-mode class on the body
        document.body.classList.toggle('dark-mode');

        // Save the user's preference to localStorage
        let theme = 'light-mode'; // Default to light
        if (document.body.classList.contains('dark-mode')) {
          theme = 'dark-mode';
        }
        localStorage.setItem('theme', theme);
      });
    </script>
  </body>
</html>
