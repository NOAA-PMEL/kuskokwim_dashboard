# pixi.toml
[workspace]
name = "kuskokwim_dashboard"
version = "0.2.1"
description = "A dashboard to fetch, process, and visualize Kuskokwim Bay sea ice data."
channels = ["conda-forge"] # Use conda-forge as the primary channel
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[tasks]
# Defines runnable scripts. Run with `pixi run start`
get_data = "python scripts/run_get_data.py"
get_build_ADFG_grid = "python scripts/run_build_ADFGgrid.py"
populate_ADFG_grid = "python scripts/run_populate_ADFGgrid.py"
#TODO: run projection code here
archive = "python scripts/run_archive_builder.py"
prediction = "python scripts/run_prediction.py"
plotgen = "python scripts/run_plotgen.py"
mapgen = "python scripts/run_mapgen.py"
test = "pytest"
lint = "ruff check ."

[dependencies]
# Core runtime dependencies from conda
numpy = ">=1,<2"
pandas = "==2.2.3"
pyarrow = "==16.1.0"
python = "==3.12"
folium = "==0.19.6"
geopandas = "==1.0.1"
matplotlib = ">=3.8.0"
shapely = ">=2.0.0"
dask = "==2024.12.1"
# Tools for development only, not needed for running the main script
pytest = ">=8.0.0"
ruff = ">=0.4.0"
plotly = ">=6.5.0,<7"
xarray = ">=2026.2.0,<2027"
erddapy = ">=3.1.1,<4"
cartopy = ">=0.25.0,<0.26"
netcdf4 = ">=1.7.4,<2"
jupyterlab = ">=4.5.6,<5"
pixi-kernel = ">=0.7.1,<0.8"

[pypi-dependencies]
# Dependencies best installed from PyPI
arcgis = ">=2.4.1.3"
kuskokwim_dashboard = { path = ".", editable = true }



